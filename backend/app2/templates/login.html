<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepScanX-AI | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: #030305;
            color: #ffffff;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #glow-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 0;
            pointer-events: none;
            opacity: 0.8;
        }

        .login-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 2rem;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-container {
            background: rgba(13, 14, 21, 0.4);
            backdrop-filter: blur(20px) saturate(150%);
            -webkit-backdrop-filter: blur(20px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 2.5rem 2rem;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .login-container:hover {
            transform: translateY(-8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8),
                0 0 40px rgba(100, 100, 255, 0.2);
        }

        .logo-text {
            font-size: 2.2rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #ffffff 0%, #a0a0ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .subtitle {
            text-align: center;
            color: #8b8baf;
            font-size: 0.95rem;
            font-weight: 300;
            margin-bottom: 2.5rem;
        }

        .flash-messages {
            margin-bottom: 1.5rem;
        }

        .flash-messages p {
            color: #ff6b6b;
            font-size: 0.85rem;
            text-align: center;
            background: rgba(255, 107, 107, 0.1);
            padding: 0.75rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 107, 107, 0.2);
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            75% {
                transform: translateX(5px);
            }
        }

        .input-group {
            position: relative;
            margin-bottom: 1.5rem;
        }

        .input-group input {
            width: 100%;
            padding: 1rem 1.2rem;
            font-size: 1rem;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            color: #ffffff;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            background: rgba(0, 0, 0, 0.4);
            border-color: #6464ff;
            box-shadow: 0 0 0 4px rgba(100, 100, 255, 0.15);
        }

        .input-group label {
            position: absolute;
            left: 1.2rem;
            top: 50%;
            transform: translateY(-50%);
            color: #6a6a8f;
            font-size: 1rem;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus~label,
        .input-group input:valid~label {
            top: -0.5rem;
            left: 1rem;
            font-size: 0.75rem;
            color: #a0a0ff;
            background: #0d0e15;
            padding: 0 0.4rem;
            border-radius: 4px;
        }

        .btn-submit {
            width: 100%;
            padding: 1rem;
            font-size: 1.05rem;
            font-weight: 600;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            border: none;
            border-radius: 14px;
            color: #ffffff;
            cursor: pointer;
            margin-top: 1rem;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.3);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(79, 70, 229, 0.4);
            background: linear-gradient(135deg, #4338ca 0%, #6d28d9 100%);
        }

        .btn-submit:active {
            transform: translateY(1px);
        }

        .auth-links {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.9rem;
            color: #8b8baf;
        }

        .auth-links a {
            color: #a0a0ff;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s;
            margin-left: 0.3rem;
            position: relative;
        }

        .auth-links a::after {
            content: '';
            position: absolute;
            width: 100%;
            transform: scaleX(0);
            height: 1px;
            bottom: -2px;
            left: 0;
            background-color: #a0a0ff;
            transform-origin: bottom right;
            transition: transform 0.25s ease-out;
        }

        .auth-links a:hover {
            color: #ffffff;
        }

        .auth-links a:hover::after {
            transform: scaleX(1);
            transform-origin: bottom left;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 2rem 1.5rem;
            }
        }
    </style>
</head>

<body>
    <canvas id="glow-canvas"></canvas>

    <div class="login-wrapper">
        <div class="login-container">
            <div class="logo-text">DeepScanX-AI</div>
            <div class="subtitle">Welcome back to your dashboard</div>

            {% with messages = get_flashed_messages() %}
            {% if messages %}
            <div class="flash-messages">
                {% for message in messages %}
                <p>{{ message }}</p>
                {% endfor %}
            </div>
            {% endif %}
            {% endwith %}

            <form method="POST">
                <div class="input-group">
                    <input type="email" id="email" name="email" required autocomplete="off">
                    <label for="email">Email Address</label>
                </div>

                <div class="input-group">
                    <input type="password" id="password" name="password" required autocomplete="off">
                    <label for="password">Password</label>
                </div>

                <button type="submit" class="btn-submit">Sign In</button>
            </form>

            <!-- Divider -->
            <div style="display:flex;align-items:center;gap:1rem;margin:1.8rem 0 1.5rem">
                <div style="flex:1;height:1px;background:rgba(255,255,255,0.1)"></div>
                <span style="color:#6a6a8f;font-size:.82rem;text-transform:uppercase;letter-spacing:1px">or</span>
                <div style="flex:1;height:1px;background:rgba(255,255,255,0.1)"></div>
            </div>

            <!-- Google Sign-In Button -->
            <div id="g_id_onload" data-client_id="{{ google_client_id }}" data-callback="handleGoogleCredential"
                data-auto_prompt="false">
            </div>
            <div id="googleBtnWrap" style="display:flex;justify-content:center"></div>

            <div class="auth-links">
                Don't have an account? <a href="{{ 'http://localhost:5173/sign-up' }}">Create one</a>
            </div>
            <div class="auth-links" style="margin-top:0.8rem">
                <a href="{{ url_for('app1.home') }}" style="color:#6a6a8f">&larr; Back to Home</a>
            </div>
        </div>
    </div>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        /* ─── Google Sign-In callback ─── */
        function handleGoogleCredential(response) {
            fetch('/app2/google_callback', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ credential: response.credential })
            })
                .then(r => r.json())
                .then(data => {
                    if (data.ok) {
                        window.location.href = '/app1/';
                    } else {
                        alert(data.error || 'Google sign-in failed');
                    }
                })
                .catch(() => alert('Network error during Google sign-in'));
        }

        /* ─── Render Google button after GIS loads ─── */
        window.addEventListener('load', () => {
            if (typeof google !== 'undefined' && google.accounts) {
                google.accounts.id.renderButton(
                    document.getElementById('googleBtnWrap'),
                    {
                        type: 'standard',
                        theme: 'filled_black',
                        size: 'large',
                        width: 340,
                        text: 'signin_with',
                        shape: 'pill',
                        logo_alignment: 'left'
                    }
                );
            }
        });
    </script>
    <script>
        (() => {
            const canvas = document.getElementById('glow-canvas');
            const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setSize(window.innerWidth, window.innerHeight);

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
            camera.position.z = 300;

            const PARTICLE_COUNT = Math.min(12000, Math.floor((window.innerWidth * window.innerHeight) / 1000));
            const BOUNDS = 500;

            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(PARTICLE_COUNT * 3);
            const speeds = new Float32Array(PARTICLE_COUNT);
            const sizes = new Float32Array(PARTICLE_COUNT);
            const seed = new Float32Array(PARTICLE_COUNT);

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const i3 = i * 3;
                positions[i3] = (Math.random() - 0.5) * BOUNDS * 2;
                positions[i3 + 1] = (Math.random() - 0.5) * BOUNDS;
                positions[i3 + 2] = (Math.random() - 0.5) * BOUNDS * 0.5;
                speeds[i] = 0.2 + Math.random() * 1.0;
                sizes[i] = 1.0 + Math.random() * 2.5;
                seed[i] = Math.random() * 1000.0;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('aSpeed', new THREE.BufferAttribute(speeds, 1));
            geometry.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
            geometry.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));

            const vertexShader = `
        uniform float uTime;
        attribute float aSpeed;
        attribute float aSize;
        attribute float aSeed;
        varying float vDepth;
        varying float vSeed;

        void main() {
            vec3 pos = position;
            float t = uTime * 0.15 * aSpeed + aSeed;
            pos.x += sin(t * 0.8) * 20.0;
            pos.y += cos(t * 1.0) * 15.0;
            pos.z += sin(t * 0.6) * 8.0;

            vDepth = (pos.z + ${BOUNDS.toFixed(1)}) / ${(BOUNDS * 2).toFixed(1)};
            
            vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
            gl_Position = projectionMatrix * mvPosition;
            gl_PointSize = (aSize * 2.0 + 6.0) * (250.0 / (250.0 + mvPosition.z));
            vSeed = aSeed;
        }
    `;

            const fragmentShader = `
        precision highp float;
        uniform float uTime;
        varying float vDepth;
        varying float vSeed;

        void main() {
            vec2 uv = gl_PointCoord - 0.5;
            float dist = length(uv);
            float alpha = smoothstep(0.5, 0.0, dist);
            
            float pulse = 0.5 + 0.5 * sin(uTime * 1.2 + vSeed * 4.0);
            
            vec3 colorA = vec3(0.39, 0.40, 0.95);
            vec3 colorB = vec3(0.55, 0.36, 0.96);
            vec3 colorC = vec3(0.93, 0.28, 0.60);
            
            float mixVal = smoothstep(0.0, 1.0, vDepth);
            vec3 col = mix(colorA, colorB, mixVal);
            col = mix(col, colorC, sin(uTime * 0.25 + vSeed) * 0.3);
            
            float halo = smoothstep(0.6, 0.0, dist);
            float glow = pow(halo, 1.8) * alpha * pulse;
            
            gl_FragColor = vec4(col * glow, glow * 0.85);
            if (dist > 0.5) discard;
        }
    `;

            const uniforms = {
                uTime: { value: 0 },
                uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
            };

            const material = new THREE.ShaderMaterial({
                uniforms,
                vertexShader,
                fragmentShader,
                transparent: true,
                depthTest: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            });

            const points = new THREE.Points(geometry, material);
            scene.add(points);

            function onResize() {
                const w = window.innerWidth;
                const h = window.innerHeight;
                renderer.setSize(w, h);
                camera.aspect = w / h;
                camera.updateProjectionMatrix();
                uniforms.uResolution.value.set(w, h);
            }
            window.addEventListener('resize', onResize, { passive: true });

            let mouseX = 0, mouseY = 0;
            window.addEventListener('mousemove', (e) => {
                mouseX = (e.clientX / window.innerWidth) - 0.5;
                mouseY = (e.clientY / window.innerHeight) - 0.5;
            }, { passive: true });

            const clock = new THREE.Clock();
            function animate() {
                requestAnimationFrame(animate);
                uniforms.uTime.value = clock.getElapsedTime();

                camera.position.x += (mouseX * 30 - camera.position.x) * 0.02;
                camera.position.y += (-mouseY * 15 - camera.position.y) * 0.02;
                camera.lookAt(0, 0, 0);

                points.rotation.y += 0.0006;
                points.rotation.x += 0.0002;

                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('pagehide', () => {
                geometry.dispose();
                material.dispose();
                renderer.dispose();
            });
        })();
    </script>
</body>

</html>
